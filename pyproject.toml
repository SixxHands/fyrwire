[project]
name = "fyrwire"
version = "0.1.0"
description = "Keep your connections... connected! Dynamic DNS for a moving address AND port."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "sixxhands" }]

[project.scripts]
fyrwire = "fyrwire.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fyrwire"]
