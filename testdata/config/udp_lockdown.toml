#EXPECT accept
#WHY max_per_ip = 0 means allow nothing, not fall back to the default

[source]
type = "natpmp"
gateway = "10.2.0.1"

[provider]
type = "cloudflare"
api_token = "env:FYRWIRE_CF_TOKEN"
zone_id = "abc123"

[node]
a_name = "node.example.com"
ttl = 60
relay = true
relay_udp = true

[node.udp]
max_per_ip = 0
new_per_sec = 0

[[service]]
name = "minecraft"
internal_port = 25565
srv_name = "_minecraft._tcp.play.example.com"
